<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes da receita</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-success">
        <div class="container">
            <a class="navbar-brand" href="index.html">Meu Site de Receitas</a>
            <a href="index.html" class="btn btn-light">Voltar</a>
        </div>
    </nav>

    <main class="container my-5">
        <div id="detalhes"></div>

        <hr class="my-5">
        <h2>Deixe seu comentário</h2>
        <form id="form-comentario" class="mb-4">
            <div class="mb-3">
                <label for="nome" class="form-label">Nome:</label>
                <input type="text" id="nome" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="comentario" class="form-label">Comentário:</label>
                <textarea id="comentario" class="form-control" rows="3" required></textarea>
            </div>
            <button type="submit" class="btn btn-success">Enviar</button>
        </form>

        <h3>Comentários</h3>
        <div id="comentarios"></div>
    </main>

    <footer class="bg-success text-white text-center p-3">
        <p class="mb-0">Meu Site de Receitas - 2026</p>
    </footer>

    <script src="js/receitas.js"></script>
</body>
</html>
